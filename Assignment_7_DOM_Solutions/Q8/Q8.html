<!DOCTYPE html>
<html><head><title>Custom Dropdown</title><link rel="stylesheet" href="Q8.css"></head>
<body>
<h2>Custom Dropdown</h2>
<div id="dropdown">
  <button id="dropdownButton" type="button">Select a course ▼</button>
  <div id="options" hidden>
    <button type="button" class="option">JavaScript</button>
    <button type="button" class="option">Python</button>
    <button type="button" class="option">Java</button>
    <button type="button" class="option">C++</button>
  </div>
</div>
<script src="Q8.js"></script>
</body></html>
