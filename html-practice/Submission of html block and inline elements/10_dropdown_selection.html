<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>
    <h1>Travel Selection Page</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>UAE</option>
    </select>
    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
    </select>
    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Agra</option>
        <option>New Delhi</option>
        <option>Mumbai</option>
        <option>Jaipur</option>
    </select>
    <br><br>

    <!-- Favorite tourist place -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Red Fort</option>
        <option>Gateway of India</option>
        <option>Hawa Mahal</option>
    </select>

    <p>I have selected India, Uttar Pradesh, Agra, and the Taj Mahal as my travel choices.</p>
</body>
</html>
