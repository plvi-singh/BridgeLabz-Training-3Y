<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>
    <h1>ABC Public School</h1>

    <h2>Student Report Card</h2>

    <table border="1" title="Student marks report">
        <tr>
            <th>Student Name</th>
            <th colspan="5">Subject Marks</th>
        </tr>
        <tr>
            <td rowspan="2">Your Name</td>
            <th>English</th>
            <th>Mathematics</th>
            <th>Science</th>
            <th>Computer</th>
            <th>Social Science</th>
        </tr>
        <tr>
            <td>88</td>
            <td>92</td>
            <td>85</td>
            <td>95</td>
            <td>90</td>
        </tr>
        <tr>
            <th colspan="3">Total</th>
            <td colspan="3">450 / 500</td>
        </tr>
        <tr>
            <th colspan="3">Percentage</th>
            <td colspan="3">90%</td>
        </tr>
    </table>
</body>
</html>
