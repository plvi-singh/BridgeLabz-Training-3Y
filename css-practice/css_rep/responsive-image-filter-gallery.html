<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header class="site-header">
        <h1>Image Filter Gallery</h1>
        <p>Hover over an image to reveal its original appearance.</p>
    </header>
    <main>
        <section class="gallery" aria-label="Filtered image gallery">
            <figure class="gallery-card"><img class="blur" src="assets/mountain.svg" alt="Mountain landscape"><figcaption>Blur</figcaption></figure>
            <figure class="gallery-card"><img class="grayscale" src="assets/ocean.svg" alt="Ocean landscape"><figcaption>Grayscale</figcaption></figure>
            <figure class="gallery-card"><img class="sepia" src="assets/forest.svg" alt="Forest landscape"><figcaption>Sepia</figcaption></figure>
            <figure class="gallery-card"><img class="brightness" src="assets/sunset.svg" alt="Sunset landscape"><figcaption>Brightness</figcaption></figure>
            <figure class="gallery-card"><img class="contrast" src="assets/city.svg" alt="City landscape"><figcaption>Contrast</figcaption></figure>
            <figure class="gallery-card"><img class="hue" src="assets/desert.svg" alt="Desert landscape"><figcaption>Hue Rotate</figcaption></figure>
        </section>
    </main>
    <footer>Responsive CSS Assignment 9 • Question 1</footer>
</body>
</html>
