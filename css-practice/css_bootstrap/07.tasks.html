<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="07.tasks.css"></head>
<body><main class="container py-5"><header class="d-flex flex-wrap justify-content-between align-items-center mb-4"><h1>Task Tracker</h1><span class="badge bg-danger fs-6">5 Pending</span></header>
<div class="list-group"><div class="list-group-item d-flex justify-content-between align-items-center">Finish Bootstrap assignment <span class="badge bg-danger rounded-pill">High</span></div><div class="list-group-item d-flex justify-content-between align-items-center">Practice Java <span class="badge bg-warning text-dark rounded-pill">Medium</span></div><div class="list-group-item d-flex justify-content-between align-items-center">Read documentation <span class="badge bg-success rounded-pill">Low</span></div><div class="list-group-item d-flex justify-content-between align-items-center">Update portfolio <span class="badge bg-warning text-dark rounded-pill">Medium</span></div><div class="list-group-item d-flex justify-content-between align-items-center">Plan weekly goals <span class="badge bg-success rounded-pill">Low</span></div></div>
<button class="btn btn-dark mt-4">Completed <span class="badge text-bg-light">3</span></button></main></body></html>
