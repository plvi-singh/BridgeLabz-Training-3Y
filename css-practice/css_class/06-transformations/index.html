<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>CSS Transformations Showcase</h1>
    <section class="transform-grid">
      <article><div class="shape rotate">Rotate</div><p>rotate()</p></article>
      <article><div class="shape scale">Scale</div><p>scale()</p></article>
      <article><div class="shape translate">Move</div><p>translate()</p></article>
      <article><div class="shape skew">Skew</div><p>skew()</p></article>
    </section>
  </main>
</body>
</html>
