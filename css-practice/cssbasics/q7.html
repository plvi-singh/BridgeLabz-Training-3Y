<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contact Us</title><link rel="stylesheet" href="q7.css"></head>
<body><main><form><h1>Contact Us</h1><label for="name">Name</label><input id="name" type="text" placeholder="Enter your name" required>
<label for="email">Email</label><input id="email" type="email" placeholder="Enter your email" required>
<label for="subject">Subject</label><input id="subject" type="text" placeholder="Enter subject">

<button type="submit">Send Message</button></form></main></body></html>
