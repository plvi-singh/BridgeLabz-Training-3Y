<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Borders &amp; Padding</h1></header>
  <main class="container">
    <section class="box solid"><h2>Solid Border</h2><p>Padding: 12px</p></section>
    <section class="box dashed"><h2>Dashed Border</h2><p>Padding: 20px</p></section>
    <section class="box double"><h2>Double Border</h2><p>Padding: 28px</p></section>
    <section class="box groove"><h2>Groove Border</h2><p>Padding: 36px</p></section>
    <section class="box rounded"><h2>Rounded Corners</h2><p>border-radius: 24px</p></section>
  </main>
  <footer>Hover a box to see the border transition.</footer>
</body>
</html>
