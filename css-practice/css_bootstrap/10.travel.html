<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Travel Agency</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="10.travel.css"></head>
<body><header class="py-4 text-center bg-dark text-white"><h1>WanderWise</h1><p class="mb-0">Discover your next journey</p></header>
<main><section id="travelCarousel" class="carousel slide" data-bs-ride="carousel"><div class="carousel-indicators"><button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="0" class="active"></button><button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="1"></button><button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="2"></button></div>
<div class="carousel-inner"><div class="carousel-item active" data-bs-interval="3000"><div class="slide delhi"><div class="carousel-caption"><h2>Delhi</h2><p>Explore history, food and culture.</p></div></div></div><div class="carousel-item" data-bs-interval="4000"><div class="slide mountains"><div class="carousel-caption"><h2>Himalayas</h2><p>Find adventure among the mountains.</p></div></div></div><div class="carousel-item" data-bs-interval="5000"><div class="slide beach"><div class="carousel-caption"><h2>Goa</h2><p>Relax beside beautiful beaches.</p></div></div></div></div>
<button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button></div>
<section class="container py-5"><h2>Booking Completion</h2><div class="progress" role="progressbar" aria-label="Booking completion" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:70%">70%</div></div></section></main>
<footer class="bg-dark text-white text-center py-4"><p class="mb-1">Contact: +91 98765 43210</p><p class="mb-0">travel@wanderwise.example</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
