<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Advanced CSS Selectors</h1>
    <section class="demo">
      <h2>Attribute Selector Demo</h2>
      <input type="text" placeholder="Text input">
      <input type="email" placeholder="Email input">
      <p><a href="https://example.com">Secure HTTPS link</a></p>
      <ul>
        <li>First item</li><li>Second item</li><li>Third item</li><li>Fourth item</li>
      </ul>
      <div class="combinators">
        <p>Descendant paragraph</p>
        <p>Direct child paragraph</p>
        <span>Sibling span</span>
        <span>Another general sibling</span>
      </div>
    </section>
  </main>
</body>
</html>
