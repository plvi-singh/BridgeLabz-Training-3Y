<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Schedule</title>
</head>
<body>
    <header>
        <h1>Technology Conference 2026</h1>
    </header>

    <table border="1">
        <caption>Conference Schedule</caption>

        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Morning</td>
                <td>10:00 AM</td>
                <td>Artificial Intelligence</td>
                <td>Dr. Mehta</td>
            </tr>
            <tr>
                <td>Afternoon</td>
                <td>1:00 PM</td>
                <td>Cybersecurity</td>
                <td>Ms. Sharma</td>
            </tr>
            <tr>
                <td>Evening</td>
                <td>4:00 PM</td>
                <td>Cloud Computing</td>
                <td>Mr. Verma</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Conference ends at 5:00 PM.</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
