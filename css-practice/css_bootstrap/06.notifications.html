<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notifications Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="06.notifications.css"></head>
<body class="bg-light"><main class="container py-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="mb-4">Notifications</h1>
<div class="alert alert-success">Success! Your profile was updated successfully.</div><div class="alert alert-info">Tip: Complete your profile to unlock more features.</div><div class="alert alert-danger">Warning: Your password expires in 3 days.</div>
<div class="alert alert-warning alert-dismissible fade show" role="alert">You have a new security notification.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
<section class="summary bg-light border rounded p-4 mt-4"><h2>Summary</h2><p class="mb-1">New messages: <strong>4</strong></p><p class="mb-1">Updates: <strong>3</strong></p><p class="mb-0">Warnings: <strong>1</strong></p></section>
</div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
