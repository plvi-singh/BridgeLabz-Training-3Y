<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and Width Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="size-box px"><h2>PX Box</h2><p>240px × 140px</p></section>
    <section class="size-box percent"><h2>% Box</h2><p>70% width</p></section>
    <section class="size-box viewport"><h2>VH Box</h2><p>25vh height</p></section>
    <section class="size-box em"><h2>EM Box</h2><p>18em width</p></section>
  </main>
</body>
</html>
